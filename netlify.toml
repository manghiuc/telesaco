[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# ===== Legal pages (URLs limpias) =====
[[redirects]]
  from = "/politica-privacidad"
  to   = "/politica-privacidad.html"
  status = 200

[[redirects]]
  from = "/condiciones"
  to   = "/condiciones.html"
  status = 200

[[redirects]]
  from = "/aviso-legal"
  to   = "/aviso-legal.html"
  status = 200

