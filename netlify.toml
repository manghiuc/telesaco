# Telesaco en Madrid — configuración de Netlify
# Solo se publica lo que copia el build (carpeta dist): nada de scripts, funciones ni ficheros internos.
[build]
  command   = "rm -rf dist && mkdir dist && cp -r assets src *.html robots.txt sitemap.xml llms.txt site.webmanifest favicon.ico dist/"
  publish   = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# ===== Páginas con URL limpia =====
# La dirección técnica de Netlify no debe servir una copia de la web
[[redirects]]
  from = "https://telesaco-madrid.netlify.app/*"
  to   = "https://telesacoenmadrid.es/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/politica-privacidad"
  to   = "/politica-privacidad.html"
  status = 200

[[redirects]]
  from = "/condiciones"
  to   = "/condiciones.html"
  status = 200

[[redirects]]
  from = "/aviso-legal"
  to   = "/aviso-legal.html"
  status = 200

[[redirects]]
  from = "/contenedores-escombro-madrid"
  to   = "/contenedores-escombro-madrid.html"
  status = 200

# Versión antigua de las condiciones -> vigente
[[redirects]]
  from = "/condiciones-servicio"
  to   = "/condiciones"
  status = 301
  force = true

[[redirects]]
  from = "/condiciones-servicio.html"
  to   = "/condiciones"
